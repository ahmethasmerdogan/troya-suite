# Troya Engine — 12-factor config (ROADMAP Faz 0). Değerler env'den override edilir.
spring:
  application:
    name: troya-eticket
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/troya}
    username: ${DB_USER:troya}
    password: ${DB_PASSWORD:troya}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# F6 — outbox relay hedefi (Redpanda/Kafka). Container'da KAFKA_BOOTSTRAP=redpanda:9092.
troya:
  kafka:
    bootstrap: ${KAFKA_BOOTSTRAP:localhost:19092}
    topic: ${KAFKA_TOPIC:troya.events}

# Keycloak (OIDC) — Faz 0'da resource server ileride aktifleşir
# security.oauth2.resourceserver.jwt.issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/troya}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}
