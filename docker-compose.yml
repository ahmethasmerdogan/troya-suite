# Troya Engine — dev altyapısı (ROADMAP Faz 0). `docker compose up -d`
# Postgres (event store + read model) · Redpanda (Kafka) · Redis (control lease) · Keycloak (OIDC).
# Host port'lar env ile override edilebilir (başka projelerle çakışmayı önler):
#   DB_PORT=15432 REDIS_PORT=16379 docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: troya
      POSTGRES_USER: troya
      POSTGRES_PASSWORD: troya
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U troya"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      # iç listener (compose ağı: redpanda:9092) + dış listener (host: localhost:19092)
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "${KAFKA_PORT:-19092}:19092"

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "${KEYCLOAK_PORT:-8081}:8081"

volumes:
  pgdata:
